<header class="site-header">
  <div class="nav-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="Ahmad Khan home">
      <span class="brand-mark">AK</span>
      <span class="brand-copy"><strong>AHMAD KHAN</strong><small>DEVELOPER PORTFOLIO</small></span>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen"
      aria-controls="primary-navigation"
      [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'">
      <span></span><span></span>
    </button>

    <nav id="primary-navigation" class="nav-links" [class.is-open]="menuOpen" aria-label="Primary navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      <a routerLink="/skills" routerLinkActive="active" (click)="closeMenu()">Skills</a>
      <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Projects</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
      <a class="nav-cta" routerLink="/contact" (click)="closeMenu()">LET'S CONNECT <span>↗</span></a>
    </nav>
  </div>
</header>
